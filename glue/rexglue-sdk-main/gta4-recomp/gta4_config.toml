# --- Extra CRT variants (bare-libc; coexist with VMX variants above) -----------
"0x82A02230" = { name = "memmove" }            # 40 xrefs — also [rexcrt]
# 0x829FF840 and 0x82A00DC0 are the REAL memset/memcpy per FLIRT-TRUSTED match.
# Moved to [rexcrt] block above; these [functions] entries force the codegen
# split so the native rexcrt_memset/rexcrt_memcpy bindings resolve cleanly.
"0x829FF840" = { name = "memset" }             # 357 callers — real memset (pass-3 fix)
"0x82A00DC0" = { name = "memcpy" }             # 577 callers — real memcpy (pass-3 fix)
