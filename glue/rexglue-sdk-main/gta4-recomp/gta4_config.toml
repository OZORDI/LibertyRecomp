# FLIRT-verified additions (2026-04-18)
# Applied dolphin.sig + gow3.sig via idat in IDA 9.2 → 2,576 LIB-flagged funcs.
# All entries below verified:
#   (a) FLIRT match is TRUSTED (D3D/NT/CRT/X* family, not UE/GoW3 internals)
#   (b) address resolves to a real sub_* function via MCP resolve_address
#   (c) call count > 0 OR explicit indirect-call helper
